<style>
/* Layout: dashboard home (big tiles in two groups) → one page per section with back button and ≤3 tabs */
:root{
  --paper:#F7F0EE; --sheet:#FFFDFC; --ink:#2B2224; --muted:#776769; --line:#EADCD9;
  --rose:#A84D62; --rose-soft:#F3DDE2; --sage:#56755B; --sage-soft:#E2ECE1; --teal:#1E5660; --teal-soft:#DCEBEC;
  --navy:#34508A; --navy-soft:#E1E8F5; --gold:#9A6B1F; --gold-soft:#F4EAD6;
  --shadow:0 1px 2px rgba(80,40,50,.06),0 8px 28px rgba(80,40,50,.07);
  --f-display:"El Messiri","Tajawal",sans-serif;
  --f-verse:"Amiri","Traditional Arabic",serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#191415; --sheet:#231C1E; --ink:#F2E8E7; --muted:#B5A4A6; --line:#3A2F32;
  --rose:#E59BAD; --rose-soft:#3C2429; --sage:#A3C2A5; --sage-soft:#22302A; --teal:#86BEC7; --teal-soft:#1B3236;
  --navy:#9DB6EA; --navy-soft:#1E2738; --gold:#E2BE7E; --gold-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#191415; --sheet:#231C1E; --ink:#F2E8E7; --muted:#B5A4A6; --line:#3A2F32;
  --rose:#E59BAD; --rose-soft:#3C2429; --sage:#A3C2A5; --sage-soft:#22302A; --teal:#86BEC7; --teal-soft:#1B3236;
  --navy:#9DB6EA; --navy-soft:#1E2738; --gold:#E2BE7E; --gold-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.8;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
img{max-width:100%}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;height:72px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--teal);text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);margin-inline-start:10px}
.top-act{display:flex;gap:8px;align-items:center}
.pill{font-size:16px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:7px 18px;cursor:pointer;text-decoration:none;white-space:nowrap}
.au-chip{font-size:16px!important;padding:7px 18px!important}
@media (max-width:600px){.home-pill{display:none}.brand small{display:none}.brand{font-size:21px}.pill,.au-chip{font-size:14px!important;padding:6px 12px!important}.top-in{height:62px}}

.main{max-width:1320px;margin:0 auto;padding-block:30px 60px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* home */
.hello{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.hello h1{font-family:var(--f-display);font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1.3}
.hello p{color:var(--muted);font-size:18px;margin-top:2px}
.add-big{font-weight:700;font-size:21px;background:var(--rose);color:#fff;border:0;border-radius:16px;padding:16px 32px;cursor:pointer;box-shadow:0 8px 20px rgba(168,77,98,.28)}
.add-big:hover{filter:brightness(1.06)}
.gh{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;margin:6px 0 14px}
.gh::after{content:"";flex:1;height:1.5px;background:var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:32px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.rgrid,.pgrid{grid-template-columns:minmax(0,1fr)}}
.rc{display:block;text-decoration:none;background:var(--sheet);border-radius:18px;padding:20px 22px;border:1.5px solid var(--line);border-top:8px solid var(--fc);transition:transform .15s,box-shadow .15s}
.rc:hover,.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rc h3{font-size:20px;font-weight:700;line-height:1.4}
.rc .n{font-family:var(--f-display);font-weight:700;font-size:46px;color:var(--fc);line-height:1.25;margin-top:8px;font-variant-numeric:tabular-nums}
.rc .l{color:var(--muted);font-size:15px}
.rc .go{margin-top:10px;font-size:15px;color:var(--fc);font-weight:700}
.pc{display:flex;gap:16px;align-items:center;text-decoration:none;background:var(--sheet);border:1.5px solid var(--line);border-radius:18px;padding:20px 22px;min-height:104px;transition:transform .15s,box-shadow .15s}
.ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--ib);color:var(--ifc)}
.ic svg{width:28px;height:28px}
.pc h3{font-size:20px;font-weight:700}
.pc p{color:var(--muted);font-size:15px;line-height:1.6;margin-top:2px}
.pc.soon{border-style:dashed}

/* section page */
.back{display:inline-flex;align-items:center;gap:8px;font-size:18px;color:var(--teal);font-weight:700;text-decoration:none;margin-bottom:10px;padding:4px 0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4vw,42px);color:var(--fc,var(--ink));line-height:1.3}
.ph p{color:var(--muted);font-size:17px;max-width:75ch;margin-top:4px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:22px 0 22px;overflow-x:auto}
.tab{font-size:18px;padding:11px 24px;border-radius:12px 12px 0 0;color:var(--muted);background:none;border:2px solid transparent;border-bottom:0;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--fc,var(--teal));font-weight:700;border-color:var(--line);border-bottom:2px solid var(--sheet)}
.panel{min-width:0}

.tools{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1 1 260px;min-width:0;font-size:17px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:12px;padding:12px 16px}
.btn{font-weight:700;font-size:17px;background:var(--fc,var(--teal));color:var(--sheet);border:0;border-radius:12px;padding:12px 24px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
.login-hint{align-self:center;font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-size:15px;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fc,var(--teal));border-color:var(--fc,var(--teal));color:var(--sheet)}
.chip span{opacity:.75;margin-inline-start:6px;font-variant-numeric:tabular-nums}

.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--sheet)}
table.t{width:100%;border-collapse:collapse;font-size:17px;min-width:560px}
.t th{background:var(--fs,var(--teal-soft));color:var(--fc,var(--teal));font-weight:700;text-align:start;padding:12px 14px;font-size:15px;white-space:nowrap}
.t td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
.t td.c{white-space:nowrap;font-variant-numeric:tabular-nums}
.t td.num{color:var(--muted);width:2.5em;font-variant-numeric:tabular-nums}
.t td.nm{min-width:13em}
.t tr.tot td{font-weight:700;background:var(--fs,var(--teal-soft))}
.tg{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 12px;white-space:nowrap}
.tg.none{background:var(--rose-soft);color:var(--rose)}.tg.med{background:var(--teal-soft);color:var(--teal)}.tg.wr{background:var(--sage-soft);color:var(--sage)}
.tg.n1{background:var(--teal-soft);color:var(--teal)}.tg.n2{background:var(--navy-soft);color:var(--navy)}.tg.n3{background:var(--rose-soft);color:var(--rose)}.tg.call,.tg.pledge{background:var(--rose);color:var(--sheet)}
.ra{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.ra button{font-size:14px;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 12px;cursor:pointer}
.ra .danger{border-color:var(--rose);color:var(--rose)}
.unsure{border-bottom:1.5px dotted var(--rose)}
.flag{color:var(--rose);font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:17px;line-height:1.9;background:var(--sheet)}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.err{color:var(--rose);font-size:15px;margin:6px 0}

.block{background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.block-h h3{font-size:18px;font-weight:700}
.block-h span{font-size:14px;color:var(--muted)}
.block .tw{border:0;border-radius:0}
.block-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.orig{font-size:14px;background:none;border:0;color:var(--rose);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.cols2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:18px;align-items:start}
.cols2 .block{margin-bottom:0}

.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.mini{border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--sheet)}
.mini b{display:block;font-family:var(--f-display);font-size:30px;color:var(--fc,var(--teal));line-height:1.3;font-variant-numeric:tabular-nums}
.mini span{font-size:14px;color:var(--muted)}

.chart{border:1.5px solid var(--line);border-radius:14px;background:var(--sheet);padding:14px 10px 6px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:560px;max-width:980px;margin-inline:auto}
.chart .bar{fill:var(--fc,var(--teal))}.chart .bar.hi{fill:var(--rose)}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:13px}
.chart .val{fill:var(--ink);font-weight:700;font-size:14px}
.chart .grid{stroke:var(--line)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
@media (max-width:900px){.about{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--sheet);border:1.5px solid var(--line);border-radius:18px;padding:24px 26px}
.card h2{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--teal);margin-bottom:10px}
.card .prose{display:flex;flex-direction:column;gap:10px;font-size:18px}
.idcard{background:radial-gradient(90% 60% at 100% 0%,var(--rose-soft),transparent 60%),radial-gradient(80% 60% at 0% 100%,var(--sage-soft),transparent 65%),var(--sheet)}
.idcard .nm{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4vw,44px);color:var(--rose);line-height:1.3}
.idcard .rl{font-size:19px;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.facts div{font-size:14px;color:var(--muted)}.facts b{display:block;color:var(--ink);font-size:17px;font-weight:500}
.verse{text-align:center}
.verse .b{font-family:var(--f-verse);font-weight:700;font-size:30px;color:var(--rose)}
.verse .v{font-family:var(--f-verse);font-size:22px;line-height:2.1;margin-top:8px}
.verse .s{font-size:14px;color:var(--muted)}
.vm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.vm div{background:var(--paper);border-radius:12px;padding:14px 18px}
.vm h3{font-size:15px;color:var(--sage);font-weight:700}
.vm p{font-size:17px;margin-top:4px}
.values{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.values span{background:var(--sage-soft);color:var(--sage);border-radius:999px;padding:3px 14px;font-size:15px}
.quote{font-family:var(--f-display);font-size:28px;line-height:1.7;text-align:center;font-weight:600}
.sign{font-family:var(--f-display);font-size:22px;color:var(--rose);margin-top:12px}
.stack{display:flex;flex-direction:column;gap:18px}

/* about = one continuous page */
.doc{background:var(--sheet);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;max-width:1100px;margin-inline:auto}
.doc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:30px 40px 24px;
  background:radial-gradient(80% 120% at 100% 0%,var(--rose-soft),transparent 60%),radial-gradient(60% 120% at 0% 100%,var(--sage-soft),transparent 65%),var(--sheet);border-bottom:1px solid var(--line)}
.doc-k{font-size:14px;color:var(--sage);font-weight:700}
.doc-nm{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4vw,46px);color:var(--rose);line-height:1.3}
.doc-rl{font-size:19px}
.doc-facts{display:flex;gap:28px;flex-wrap:wrap;margin:0}
.doc-facts dt{font-size:13px;color:var(--muted)}.doc-facts dd{margin:0;font-size:17px;font-weight:500}
.doc-verse{text-align:center;padding:26px 40px;border-bottom:1px solid var(--line)}
.doc-verse .b{font-family:var(--f-verse);font-weight:700;font-size:28px;color:var(--rose)}
.doc-verse .v{font-family:var(--f-verse);font-size:22px;line-height:2.1;max-width:60ch;margin:6px auto 0}
.doc-verse .s{font-size:14px;color:var(--muted)}
.doc-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.doc-row>section{padding:26px 40px}
.doc-row>section+section{border-inline-start:1px solid var(--line)}
@media (max-width:820px){.doc-row{grid-template-columns:1fr}.doc-row>section+section{border-inline-start:0;border-top:1px solid var(--line)}.doc-head,.doc-verse,.doc-row>section,.doc-end{padding-inline:22px}}
.doc h2{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--teal);margin-bottom:8px}
.doc h3{font-size:15px;color:var(--sage);font-weight:700;margin-top:10px}
.doc section p{font-size:18px;line-height:1.95}
.doc section p+p{margin-top:8px}
.doc-values{color:var(--sage);font-weight:500}
.doc-end{padding:28px 40px 34px;text-align:center}
.doc-end p{max-width:70ch;margin-inline:auto}
.doc-end .quote{margin-top:16px}
.fixbtn{font-size:13px;line-height:1;border:1px solid var(--line);background:var(--paper);color:var(--teal);border-radius:8px;padding:3px 6px;cursor:pointer;vertical-align:middle;margin-inline-start:4px}
.fixbtn:hover{border-color:var(--teal)}
/* about accordion */
.accw{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.acc-hero{background:radial-gradient(80% 140% at 100% 0%,var(--rose-soft),transparent 60%),var(--sheet);border:1.5px solid var(--line);border-radius:18px;padding:22px 28px}
.acc{background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;font-weight:700;font-size:21px}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--rose-soft);position:relative}
.acc summary i::before,.acc summary i::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:2.5px;border-radius:2px;background:var(--rose)}
.acc summary i::after{transform:rotate(90deg);transition:transform .2s}
.acc[open] summary{color:var(--teal);border-bottom:1px solid var(--line)}
.acc[open] summary i{background:var(--teal)}
.acc[open] summary i::before,.acc[open] summary i::after{background:var(--sheet)}
.acc[open] summary i::after{transform:rotate(0)}
.acc summary:hover{background:var(--paper)}
.acc-c{padding:16px 26px 22px}
.acc-c p{font-size:18px;line-height:1.95}
.acc-c p+p{margin-top:8px}
.acc-c h3{font-size:15px;color:var(--sage);font-weight:700;margin-top:10px}
.ev-notes{margin:0;padding:12px 16px 12px 12px;padding-inline-start:30px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;font-size:15px;line-height:1.9}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev-grid .ev img{aspect-ratio:4/3;object-fit:cover}
/* goal banners */
.goalcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.gcard{position:relative;background:linear-gradient(180deg,var(--sheet),var(--paper));border:1.5px solid var(--line);border-radius:20px;padding:22px 26px 20px;overflow:hidden}
.gcard::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);border-radius:14px;pointer-events:none}
.g-lab{display:inline-block;background:var(--sage);color:var(--sheet);font-family:var(--f-display);font-weight:700;font-size:22px;border-radius:12px;padding:4px 22px;box-shadow:inset 0 0 0 2px var(--gold-soft)}
.g-txt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.4vw,28px);line-height:1.5;margin-top:14px;color:var(--ink)}
.g-year{display:inline-block;margin-top:10px;border:1.5px solid var(--sage);color:var(--sage);border-radius:999px;padding:0 18px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.g-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
.g-meta b{color:var(--ink);font-weight:700}
.g-meta a{color:var(--teal);font-weight:700}
.g-ok{color:var(--sage);font-weight:700}
.pthumb{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--paper);padding:12px;cursor:zoom-in;position:relative}
.pthumb img{display:block;width:100%;max-height:340px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:#fff}
.pthumb span{position:absolute;bottom:22px;inset-inline-start:22px;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
/* reports */
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:18px;align-items:start}
.rep{background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.rep-h{background:var(--teal-soft);padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rep-h h3{font-size:19px;color:var(--teal);font-weight:700;line-height:1.5}
.rep-h .d{font-size:14px;color:var(--teal);white-space:nowrap;font-variant-numeric:tabular-nums}
.rep-b{padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.rep-b dt{color:var(--muted)}.rep-b dd{margin:0;font-weight:500}
.rep-g{padding:0 18px 12px}
.rep-g h4{font-size:14px;color:var(--sage)}
.rep-g ul{margin:4px 0 0;padding-inline-start:20px;font-size:15px;line-height:1.8}
.rep-e{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px}
.ev{display:block;width:100%;padding:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);cursor:zoom-in}
.ev img{display:block;width:100%;height:auto}
.ev-none{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:14px}
.jtag{font-size:12px;background:var(--sheet);color:var(--teal);border-radius:999px;padding:1px 10px;margin-inline-start:12px;vertical-align:middle;display:inline-block;line-height:1.8}

/* certificates */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:18px;align-items:start}
.cert{margin:0;background:var(--sheet);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.cert figcaption{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.7}
.cert figcaption b{color:var(--ink)}
.sec-t{font-weight:700;font-size:20px;margin:6px 0 12px}
.sec-t+.certs{margin-bottom:26px}

/* schedules */
.sched td,.sched th{text-align:center!important;white-space:nowrap}
.sched td:first-child,.sched th:first-child{text-align:start!important}
.sched .me{background:var(--rose-soft);color:var(--rose);font-weight:700;border-radius:6px;padding:2px 8px}
.sched .all{color:var(--muted)}

/* weeks */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:12px;align-items:start}
.wk{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.wk summary{cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;list-style:none}
.wk summary::-webkit-details-marker{display:none}
.wk summary b{font-weight:700}
.wk summary span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk .tw{border:0;border-radius:0;border-top:1px solid var(--line)}

/* dialog (forms + chooser) */
.dlg{position:fixed;inset:0;z-index:40;background:rgba(20,14,16,.5);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg-card{background:var(--sheet);border-radius:18px;padding:24px;width:min(560px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);border-top:8px solid var(--fc,var(--teal))}
.dlg-card h2{font-family:var(--f-display);font-size:26px;font-weight:700;margin-bottom:12px}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.ff>*{grid-column:1/-1;min-width:0}
.ff>.half{grid-column:auto}
.ff label,.ff legend{font-size:14px;color:var(--muted);display:block;margin-top:6px}
.ff input:not([type=radio]):not([type=checkbox]),.ff select{font:inherit;font-size:17px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;width:100%}
.ff fieldset{border:0;padding:0;margin:0}
.radios{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.radios label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);font-size:15px;margin:0;cursor:pointer}
.radios label:has(input:checked){border-color:var(--fc,var(--teal));background:var(--fs,var(--teal-soft));color:var(--fc,var(--teal));font-weight:700}
.chk{display:flex!important;align-items:center;gap:8px;font-size:16px!important;color:var(--ink)!important;margin-top:30px!important}
.chk input{width:20px;height:20px}
.eg{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px 8px;align-items:center;margin-top:4px}
.eg b{font-size:13px;color:var(--muted);font-weight:500;text-align:center}
.eg span{font-size:15px;white-space:nowrap}
.eg input{text-align:center;padding:8px!important}
.dlg-act{display:flex;gap:10px;margin-top:16px}
@media (max-width:480px){.ff{grid-template-columns:1fr}.ff>.half{grid-column:1/-1}.chk{margin-top:8px!important}}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.choose{grid-template-columns:1fr}}
.choose button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;background:var(--sheet);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:16px 18px;cursor:pointer}
.choose button:hover{background:var(--paper)}
.choose b{font-size:18px;color:var(--c)}
.choose span{font-size:14px;color:var(--muted);line-height:1.6}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,14,16,.9);display:flex;align-items:center;justify-content:center;

.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:calc(12px + env(safe-area-inset-left,0px));font-size:16px;background:#fff;color:#2B2224;border:0;border-radius:999px;padding:8px 20px;cursor:pointer}

  return `<div class="tools">${search?`<input class="search" id="q" type="search" placeholder="ابحثي باسم الطالبة أو الفصل" value="${esc(UI.q)}" aria-label="بحث">`:"<span style='flex:1'></span>"}${add}</div>${UI.err?`<p class="err">${esc(UI.err)}</p>`:""}`}
const qMatch=r=>{const q=arKey(UI.q.trim());return !q||arKey(r.name).includes(q)||String(r.cls||"").includes(q)};
function chips(list){return `<div class="chips">${list.map(([k,l,n])=>`<button class="chip" data-act="filter" data-k="${k}" aria-pressed="${UI.filter===k}">${l}<span>${n}</span></button>`).join("")}</div>`}
const tagK=(cls,t)=>`<span class="tg ${cls}">${esc(t)}</span>`;
const paperBlock=(title,sub,img,inner,foot)=>`<div class="block"><div class="block-h"><h3>${title}</h3><span>${sub||""}</span></div>${inner}${img?`<button class="pthumb" data-full="img/${img}.jpg" aria-label="تكبير الورقة الأصلية"><img src="img/${img}.jpg" alt="الورقة الأصلية: ${title}" loading="lazy"><span>الورقة الأصلية · اضغطي للتكبير</span></button>`:""}<div class="block-f"><span>${foot||""}</span></div></div>`;

function weekChart(W){if(!W.length)return "";
  const n=W.length,Wd=Math.max(640,n*80),H=260,pl=42,pr=10,pt=28,pb=36,iw=Wd-pl-pr,ih=H-pt-pb,slot=iw/n,bw=Math.min(44,slot*.55);
  const vals=W.map(w=>w.tot.ap),mx=Math.max(...vals),mn=Math.min(...vals),top=Math.max(10,Math.ceil(mx/10)*10),y=v=>pt+ih-(v/top)*ih;let g="";
  for(let v=0;v<=top;v+=10)g+=`<line class="grid" x1="${pl}" x2="${Wd-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
  W.forEach((w,i)=>{const v=w.tot.ap,cx=Wd-pr-slot*(i+.5),bx=cx-bw/2,by=y(v),h=pt+ih-by,r=Math.min(4,h);
    g+=`<g><title>الأسبوع ${esc(w.week)}: ${f2(v)}%</title><path class="bar${v===mx?" hi":""}" d="M${bx},${pt+ih} V${by+r} Q${bx},${by} ${bx+r},${by} H${bx+bw-r} Q${bx+bw},${by} ${bx+bw},${by+r} V${pt+ih} Z"/>${(v===mx||v===mn||i===n-1)?`<text class="val" x="${cx}" y="${by-8}" text-anchor="middle">${f2(v)}%</text>`:""}<text x="${cx}" y="${H-12}" text-anchor="middle">${esc(w.week)}</text></g>`});
  return `<div class="chart"><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="نسبة الغياب الأسبوعية">${g}</svg></div>`}

const app=document.getElementById("app");
function home(){
  const nf=new Set([...XF.flatMap(f=>f.rows.map(r=>shown(r[0]))),...DB.frequent.rows.map(r=>r.name)]).size;
  const W=allWeeks(),last=W[W.length-1];
  const nums={excuses:[ready("absences")?DB.absences.rows.length:"–","غياب مسجل"],notices:[ready("notices")?DB.notices.rows.length:"–","إشعار مسجل"],frequent:[nf,"طالبة محوّلة"],stats:[f2(last.tot.ap)+"%",`غياب الأسبوع ${last.week}`]};
  return `<div class="hello"><div><h1>${canWrite?"أهلًا تركية":"ملف إنجاز تركية يحيى الزهراني"}</h1><p>المتوسطة الخامسة · مساعد إداري · 1447 – 1448هـ</p></div>${canWrite?`<button class="add-big" data-act="chooser">＋ تسجيل جديد</button>`:""}</div>
   <div class="gh">سجلات الغياب</div><div class="rgrid">${Object.keys(REC).map(k=>{const R=REC[k];return `<a class="rc" href="#${k}" style="--fc:${R.fc}"><h3>${R.short}</h3><div class="n">${nums[k][0]}</div><div class="l">${nums[k][1]}</div><div class="go">فتح ←</div></a>`}).join("")}</div>
   <div class="gh">ملف الإنجاز</div><div class="pgrid">${Object.keys(PORT).map(k=>{const P=PORT[k];return `<a class="pc${P.soon?" soon":""}" href="#${k}"><span class="ic" style="--ib:${P.ib};--ifc:${P.ifc}">${ICON[P.icon]}</span><span><h3>${P.title}</h3><p>${P.sub}</p></span></a>`}).join("")}</div>`}
function pageHead(title,desc,fc,extra){return `<a class="back" href="#">→ الرئيسية</a><div class="ph" style="--fc:${fc||"var(--ink)"}"><div><h1>${title}</h1>${desc?`<p>${desc}</p>`:""}</div>${extra||""}</div>`}
function tabsBar(key,list){const cur=UI.tab[key]||0;return `<div class="tabs" role="tablist">${list.map((t,i)=>`<button class="tab" role="tab" aria-selected="${i===cur}" data-act="tab" data-k="${key}" data-i="${i}">${t[0]}</button>`).join("")}</div>`}
let route="";
function render(keep){
  const y=scrollY;const fq=document.activeElement&&document.activeElement.id==="q";const sel=fq?document.activeElement.selectionStart:0;
  let h;
  if(REC[route]){const R=REC[route],L=TABS[route],cur=Math.min(UI.tab[route]||0,L.length-1);
    h=`<div style="--fc:${R.fc};--fs:${R.fs}">${pageHead(R.title,R.desc,R.fc,R.cover?`<div class="ph-act"><button class="btn ghost" data-full="img/${R.cover}.jpg">الغلاف الورقي</button></div>`:"")}<div style="margin-top:16px">${goalCard(GOALS[R.goal-1],false)}</div>${tabsBar(route,L)}<div class="panel">${L[cur][1]()}</div></div>`;
    document.title=R.title+" · تركية الزهراني"}
  else if(PORT[route]){const P=PORT[route];
    h=pageHead(P.title,P.desc,"var(--ink)")+(P.tabs?tabsBar(route,P.tabs)+`<div class="panel">${P.tabs[Math.min(UI.tab[route]||0,P.tabs.length-1)][1]()}</div>`:`<div style="margin-top:22px">${P.render()}</div>`);
    document.title=P.title+" · تركية الزهراني"}
  else{h=home();document.title="ملف إنجاز تركية الزهراني"}
  app.innerHTML=h;
  if(keep)window.scrollTo(0,y);
  if(fq){const q=document.getElementById("q");if(q){q.focus();try{q.setSelectionRange(sel,sel)}catch(e){}}}
}
function go(){const r=decodeURIComponent(location.hash.slice(1));const known=REC[r]||PORT[r];route=known?r:"";UI.filter="all";UI.q="";UI.confirm=null;render(false);window.scrollTo(0,0)}

    if(v.split(" ").length<2){m.textContent="اكتبي اسم الطالبة كاملًا.";return}
    b.disabled=true;b.textContent="جارٍ الحفظ…";
    try{const {data,error}=await Site.sb.from("name_fixes").upsert({original:o,corrected:v},{onConflict:"original"}).select();if(error)throw error;if(!data||!data.length)throw {code:"denied"};await load("name_fixes");closeDlg();render(true)}
    catch(x){m.textContent=(x&&(x.code==="denied"||x.code==="42501"))?"ليست لديك صلاحية التعديل.":(x&&(x.code==="42P01"||/does not exist|schema cache/i.test(x.message||"")))?"جدول تعديل الأسماء غير موجود. شغّلي ملف الإعداد في Supabase.":"لم يُحفظ. حاولي مرة أخرى."}
    finally{b.disabled=false;b.textContent="حفظ"}}}
function closeDlg(){dlg.hidden=true;editId=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function readForm(R){const o={},err=m=>{throw {user:m}};const strip=l=>l.replace(/ \(.*\)/,"");
  for(const f of R.fields){const id="ff_"+f.k;
    if(f.t==="radio"){o[f.k]=(dcard.querySelector(`input[name="${id}"]:checked`)||{}).value||f.def;continue}
    if(f.t==="bool"){o[f.k]=document.getElementById(id).checked;continue}
    if(f.t==="grid"){for(let i=1;i<=3;i++)for(const c of ["total","present","absent"]){const v=parseInt(toLatin(document.getElementById(`ff_g${i}_${c}`).value),10);if(!(v>=0))err(`اكتبي ${c==="total"?"العدد الكلي":c==="present"?"الحضور":"الغياب"} لـ${GR[i-1]}.`);o[`g${i}_${c}`]=v}continue}
    let v=toLatin(document.getElementById(id).value).trim().replace(/\s+/g," ");
    if(f.t==="month"){o[f.k]=parseInt(v,10);continue}
    if(!v&&f.opt){o[f.k]="";continue}
    if(!v)err(`اكتبي ${strip(f.l)}.`);
    if(f.t==="name"&&v.split(" ").length<2)err("اكتبي اسم الطالبة كاملًا (اسمين على الأقل).");
    if(f.t==="cls")v=v.replace(/\s/g,"");
    if(f.t==="date"){v=v.replace(/\s/g,"");if(!parseD(v))err(`اكتبي ${strip(f.l)} بهذا الشكل: يوم/شهر/سنة، مثل 15/5/1448.`)}
    if(f.t==="int"){const n=parseInt(v,10);if(!(n>=f.min&&n<=f.max))err(`${strip(f.l)}: رقم بين ${f.min} و${f.max}.`);v=n}
    o[f.k]=v}
  return o}
dlg.addEventListener("submit",async e=>{if(e.target.id!=="dform")return;e.preventDefault();const R=REC[F],m=document.getElementById("derr"),b=document.getElementById("dsave");m.textContent="";
  let body;try{body=readForm(R)}catch(x){m.textContent=x.user||"تأكدي من البيانات.";return}
  b.disabled=true;b.textContent="جارٍ الحفظ…";
  try{const q=editId?Site.sb.from(R.table).update(body).eq("id",editId).select():Site.sb.from(R.table).insert(body).select();const {data,error}=await q;if(error)throw error;if(!data||!data.length)throw {code:"denied"};
    await load(R.table);const k=F;closeDlg();if(route!==k)location.hash=k;else render(true)}
  catch(x){m.textContent=(x&&(x.code==="denied"||x.code==="42501"))?"ليست لديك صلاحية التعديل. سجّلي الدخول بحساب المالكة.":"لم يُحفظ. تأكدي من الاتصال وحاولي مرة أخرى."}
  finally{b.disabled=false;b.textContent="حفظ"}});

// ===== events =====
document.addEventListener("input",e=>{if(e.target.id==="q"){UI.q=e.target.value;render(true)}});
document.addEventListener("click",async e=>{
  const full=e.target.closest("[data-full]");if(full){e.preventDefault();openLb(full.dataset.full,full);return}
  const jad=e.target.closest("[data-jad]");if(jad){e.preventDefault();UI.rfilter=jad.dataset.jad;location.hash="reports";return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="close"){closeDlg();return}
  if(act==="chooser"){chooser();return}
  if(act==="pick"){closeDlg();if(route!==a.dataset.k)location.hash=a.dataset.k;openForm(a.dataset.k);return}
  if(act==="tab"){UI.tab[a.dataset.k]=+a.dataset.i;UI.filter="all";UI.confirm=null;render(true);return}
  if(act==="filter"){UI.filter=a.dataset.k;render(true);return}
  if(act==="rfilter"){UI.rfilter=a.dataset.k;render(true);return}
  if(act==="add"){openForm(a.dataset.rec);return}
  if(act==="fixname"){fixDialog(a.dataset.o);return}
  if(act==="fixreset"){const o=a.dataset.o;const r=DB.name_fixes.rows.find(x=>x.original===o);if(r){try{const {error}=await Site.sb.from("name_fixes").delete().eq("id",r.id);if(error)throw error;await load("name_fixes");closeDlg();render(true)}catch(x){document.getElementById("derr").textContent="لم يُحفظ. حاولي مرة أخرى."}}return}
  const R=REC[route];if(!R)return;const rows=R.table==="weekly_stats"?DB.weekly_stats.rows:DB[R.table].rows,id=a.dataset.id;
  if(act==="edit")openForm(route,rows.find(r=>r.id===id));
  else if(act==="del"){UI.confirm=id;render(true)}
  else if(act==="delno"){UI.confirm=null;render(true)}
  else if(act==="delyes"){UI.confirm=null;try{const {error}=await Site.sb.from(R.table).delete().eq("id",id);if(error)throw error;await load(R.table)}catch(x){UI.err="لم يُحذف. حاولي مرة أخرى.";render(true);setTimeout(()=>{UI.err=null;render(true)},4000)}}
  else if(act==="adopt")openForm("frequent",null,{name:a.dataset.n,cls:a.dataset.c,days:+a.dataset.d,excused:+a.dataset.e,month:+a.dataset.m,year:+a.dataset.y,referred:true});
});
dlg.addEventListener("click",e=>{if(e.target===dlg)closeDlg()});
const lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg");let lbFrom=null;
function openLb(src,from){lbFrom=from;lbImg.src=src;lb.hidden=false;document.getElementById("lbX").focus()}
function closeLb(){lb.hidden=true;lbImg.removeAttribute("src");lbFrom&&lbFrom.focus()}
document.getElementById("lbX").onclick=closeLb;lb.addEventListener("click",e=>{if(e.target===lb)closeLb()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!lb.hidden)closeLb();else if(!dlg.hidden)closeDlg()});

// ===== names list =====
function names(){const s=new Set();["absences","notices","frequent"].forEach(t=>DB[t].rows.forEach(r=>s.add(r.name)));[...FORMS,...XF].forEach(f=>f.rows.forEach(r=>s.add(shown(r[0]))));
  document.getElementById("nameList").innerHTML=[...s].sort((a,b)=>arKey(a).localeCompare(arKey(b),"ar")).map(n=>`<option value="${esc(n)}">`).join("")}
document.getElementById("clsList").innerHTML=[1,2,3].flatMap(g=>Array.from({length:10},(_,i)=>`<option value="${g}/${i+1}">`)).join("");

// ===== load =====
async function load(t){const {data,error}=await Site.sb.from(t).select("*").limit(5000);
  if(error)DB[t].state=(error.code==="42P01"||/does not exist|schema cache/i.test(error.message||""))?"missing":(DB[t].rows.length?"ready":"slow");else{DB[t].rows=data;DB[t].state="ready"}
  if(t==="name_fixes"){FIX={};DB[t].rows.forEach(r=>FIX[r.original]=r.corrected)}
  names();if(dlg.hidden)render(true)}
if(!window.Site||!Site.ready){Object.keys(DB).forEach(t=>DB[t].state="off")}
else{const tm=setTimeout(()=>{Object.keys(DB).forEach(t=>{if(DB[t].state==="loading")DB[t].state="slow"});render(true)},10000);
  Promise.all(Object.keys(DB).map(load)).then(()=>clearTimeout(tm));
  Object.keys(DB).forEach(t=>{try{Site.sb.channel("live-"+t).on("postgres_changes",{event:"*",schema:"public",table:t},()=>load(t)).subscribe()}catch(e){}});
  Site.onAuth(o=>{canWrite=o;if(!o&&!dlg.hidden)closeDlg();render(true)})}

// ===== theme =====
const themeBtn=document.getElementById("themeBtn");
const isDark=()=>{const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
const syncTheme=()=>themeBtn.textContent=isDark()?"فاتح":"داكن";
themeBtn.onclick=()=>{const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("tz-theme",n)}catch(e){}syncTheme()};
syncTheme();
names();go();

</script>
